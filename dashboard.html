<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Dashboard — Waris Ali Digital Hub</title><link rel="stylesheet" href="portal.css"></head><body><main class="wrap"><div class="top"><a class="brand" href="index.html"><span class="logo">WA</span>Waris Ali Digital Hub</a><div class="actions"><a class="btn ghost" href="index.html">Website</a><button class="btn danger" id="logout">Logout</button></div></div><div id="loading" class="card">Checking your account…</div><div id="app" class="hidden"><section class="hero"><h1>User Dashboard</h1><p id="hello" class="muted"></p></section><div class="stats"><div class="stat"><span class="muted">My Products</span><b id="count">0</b></div><div class="stat"><span class="muted">Pending</span><b id="pending">0</b></div><div class="stat"><span class="muted">Approved</span><b id="approved">0</b></div><div class="stat"><span class="muted">Unread Messages</span><b id="unread">0</b></div></div><div class="tabs card"><button class="btn tab active" data-tab="profile">Profile</button><button class="btn tab" data-tab="products">My Products</button><button class="btn tab" data-tab="add">Add Product</button><button class="btn tab" data-tab="messages">Messages</button></div><section id="profile" class="panel active card"><h2>Profile</h2><form id="profileForm"><div class="formgrid"><label>Name<input class="input" id="pname" maxlength="80"></label><label>Email<input class="input" id="pemail" disabled></label><label>Photo URL<input class="input" id="photo"></label></div><br><button class="btn primary">Save Profile</button></form><p id="pmsg" class="notice hidden"></p></section><section id="products" class="panel card"><div class="top"><div><h2>My Products</h2><p class="muted">You can edit or delete your own submissions. Approval is required before publication.</p></div><button class="btn primary" data-go="add">➕ Add Product</button></div><div id="myList" class="grid"></div></section><section id="add" class="panel card"><h2 id="formTitle">➕ Add Product</h2><form id="productForm"><div class="formgrid"><label>Name *<input class="input" id="name" required maxlength="120"></label><label>Category *<select id="cat"><option>AI Tools</option><option>Apps</option><option>Websites</option><option>Games</option><option>Digital Products</option><option>Services</option><option>Special Offers</option></select></label><label>Price<input class="input" id="price" type="number" min="0"></label><label>Discount Price<input class="input" id="sale" type="number" min="0"></label><label>Image URL<input class="input" id="image" type="url"></label><label>Visit URL *<input class="input" id="url" type="url" required></label><label>Buy URL<input class="input" id="buy" type="url"></label><label>Affiliate URL<input class="input" id="affiliate" type="url"></label><label>Download URL<input class="input" id="download" type="url"></label><label>Tags<input class="input" id="tags" placeholder="ai, design, productivity"></label><label class="full">Short Description *<textarea id="short" required maxlength="500"></textarea></label><label class="full">Full Description<textarea id="full"></textarea></label><label class="full">Screenshots (one URL per line)<textarea id="screenshots"></textarea></label><label>SEO Title<input class="input" id="seoTitle" maxlength="160"></label><label>SEO Description<input class="input" id="seoDescription" maxlength="320"></label><label class="full">SEO Keywords<input class="input" id="seoKeywords"></label></div><div class="actions" style="margin-top:15px"><button class="btn primary">Save Product</button><button type="button" class="btn ghost" id="clear">Clear</button></div><p id="productMsg" class="notice hidden"></p></form></section><section id="messages" class="panel card"><h2>Message Admin</h2><form id="messageForm"><label>Subject<input class="input" id="subject" maxlength="120" required></label><br><label>Message<textarea id="body" required maxlength="3000"></textarea></label><br><button class="btn primary">Send Message</button></form><div id="messageList"></div></section></div></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,addDoc,collection,query,where,getDocs,updateDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";import{firebaseConfig}from"./firebase-config.js";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),ADMIN="warisalidigitalsolutions@gmail.com";let user,editId=null,products=[];const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));function tab(name){document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));$(name).classList.add("active");document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===name))}document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>tab(b.dataset.tab));document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>tab(b.dataset.go));$("logout").onclick=()=>signOut(auth);function status(s){return '<span class="status '+esc(s||"pending")+'">'+esc((s||"pending").toUpperCase())+"</span>"}async function loadProfile(){const s=await getDoc(doc(db,"users",user.uid));const d=s.exists()?s.data():{};$("pname").value=d.name||user.displayName||"";$("pemail").value=user.email||d.email||"";$("photo").value=d.photoURL||user.photoURL||"";$("hello").textContent="Welcome, "+($("pname").value||user.email)+"."}async function loadProducts(){const s=await getDocs(query(collection(db,"products"),where("createdByUid","==",user.uid)));products=s.docs.map(d=>({id:d.id,...d.data()}));$("count").textContent=products.length;$("pending").textContent=products.filter(p=>p.status==="pending").length;$("approved").textContent=products.filter(p=>p.status==="approved"&&p.published===true).length;$("myList").innerHTML=products.length?products.map(p=>'<article class="card product-card"><b>'+esc(p.name)+'</b><span class="pill">'+esc(p.cat)+'</span>'+status(p.status)+'<p class="muted">'+esc(p.short||p.desc||"")+'</p><div class="actions"><button class="btn ghost" data-edit="'+p.id+'">Edit</button><button class="btn danger" data-del="'+p.id+'">Delete</button></div></article>').join(""):'<div class="empty">No products yet. Add your first product.</div>';document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.edit);editId=p.id;fill(p);tab("add")});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this product?")){await deleteDoc(doc(db,"products",b.dataset.del));await loadProducts()}})}function fill(p={}){["name","price","sale","image","url","buy","affiliate","download","seoTitle","seoDescription","seoKeywords"].forEach(k=>$(k).value=p[k]??"");$("cat").value=p.cat||"Apps";$("tags").value=(p.tags||[]).join(", ");$("short").value=p.short||p.desc||"";$("full").value=p.full||"";$("screenshots").value=(p.screenshots||[]).join("\n");$("formTitle").textContent=editId?"✏️ Edit Product":"➕ Add Product"}function clearForm(){editId=null;fill({})}$("clear").onclick=clearForm;$("productForm").onsubmit=async e=>{e.preventDefault();const data={name:$("name").value.trim(),cat:$("cat").value,price:Number($("price").value||0),sale:Number($("sale").value||0),image:$("image").value.trim(),url:$("url").value.trim(),buy:$("buy").value.trim(),affiliate:$("affiliate").value.trim(),download:$("download").value.trim(),tags:$("tags").value.split(",").map(x=>x.trim()).filter(Boolean).slice(0,20),short:$("short").value.trim(),full:$("full").value.trim(),screenshots:$("screenshots").value.split("\n").map(x=>x.trim()).filter(Boolean).slice(0,8),seoTitle:$("seoTitle").value.trim(),seoDescription:$("seoDescription").value.trim(),seoKeywords:$("seoKeywords").value.trim(),updatedAt:serverTimestamp()};try{if(editId){await updateDoc(doc(db,"products",editId),{...data,status:"pending",published:false,updatedAt:serverTimestamp()})}else{await addDoc(collection(db,"products"),{...data,createdByUid:user.uid,createdByEmail:user.email||"",status:"pending",published:false,featured:false,createdAt:serverTimestamp(),updatedAt:serverTimestamp()})}$("productMsg").textContent="Saved. Your listing is pending admin review.";$("productMsg").classList.remove("hidden");clearForm();await loadProducts();tab("products")}catch(e){$("productMsg").textContent=e.message;$("productMsg").classList.remove("hidden")}};$("profileForm").onsubmit=async e=>{e.preventDefault();try{await updateProfile(user,{displayName:$("pname").value.trim(),photoURL:$("photo").value.trim()});await setDoc(doc(db,"users",user.uid),{uid:user.uid,name:$("pname").value.trim(),email:user.email||"",photoURL:$("photo").value.trim(),updatedAt:serverTimestamp()},{merge:true});$("pmsg").textContent="Profile saved.";$("pmsg").classList.remove("hidden")}catch(e){$("pmsg").textContent=e.message;$("pmsg").classList.remove("hidden")}};$("messageForm").onsubmit=async e=>{e.preventDefault();try{await addDoc(collection(db,"messages"),{userId:user.uid,userEmail:user.email||"",subject:$("subject").value.trim(),message:$("body").value.trim(),adminReply:"",userRead:true,adminRead:false,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});$("messageForm").reset();await loadMessages()}catch(e){alert(e.message)}};async function loadMessages(){const s=await getDocs(query(collection(db,"messages"),where("userId","==",user.uid)));const arr=s.docs.map(d=>({id:d.id,...d.data()}));$("unread").textContent=arr.filter(x=>x.adminReply&&x.userRead===false).length;$("messageList").innerHTML=arr.length?arr.map(m=>'<div class="card"><b>'+esc(m.subject)+'</b><p class="muted">'+esc(m.message)+'</p>'+(m.adminReply?'<div class="notice"><b>Admin reply:</b><br>'+esc(m.adminReply)+'</div>':'<span class="status pending">WAITING FOR REPLY</span>')+'</div>').join(""):'<div class="empty">No messages yet.</div>';for(const m of arr.filter(x=>x.adminReply&&x.userRead===false))await updateDoc(doc(db,"messages",m.id),{userRead:true})}onAuthStateChanged(auth,async u=>{if(!u){location.href="login.html";return}user=u;await setDoc(doc(db,"users",u.uid),{uid:u.uid,name:u.displayName||"",email:u.email||"",photoURL:u.photoURL||"",updatedAt:serverTimestamp()},{merge:true});$("loading").classList.add("hidden");$("app").classList.remove("hidden");await loadProfile();await loadProducts();await loadMessages()});</script></body></html>
