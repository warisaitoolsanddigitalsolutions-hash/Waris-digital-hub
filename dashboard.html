<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Dashboard — Waris Ali Digital Hub</title><link rel="stylesheet" href="portal.css"><script src="supabase-runtime.js"></script></head><body><main class="wrap"><div class="top"><a class="brand" href="index.html"><span class="logo">WA</span>Waris Ali Digital Hub</a><div class="actions"><a class="btn ghost" href="index.html">Website</a><button class="btn danger" id="logout">Logout</button></div></div><div id="loading" class="card">Checking session…</div><div id="app" class="hidden"><section class="hero"><h1>User Dashboard</h1><p id="hello" class="muted"></p></section><div class="stats"><div class="stat"><span class="muted">My Products</span><b id="count">0</b></div><div class="stat"><span class="muted">Pending</span><b id="pending">0</b></div><div class="stat"><span class="muted">Approved</span><b id="approved">0</b></div><div class="stat"><span class="muted">Unread</span><b id="unread">0</b></div></div><div class="tabs card"><button class="btn tab active" data-tab="profile">Profile</button><button class="btn tab" data-tab="products">My Products</button><button class="btn tab" data-tab="add">Add Product</button><button class="btn tab" data-tab="messages">Messages</button></div><section id="profile" class="panel active card"><h2>Profile</h2><div class="formgrid"><label>Name<input class="input" id="name"></label><label>Email<input class="input" id="email" disabled></label><label>Avatar<input class="input" id="avatar" placeholder="Optional image URL"></label></div><br><button class="btn primary" id="saveProfile">Save Profile</button><p id="profileMsg" class="notice hidden"></p></section><section id="products" class="panel card"><div class="top"><div><h2>My Products</h2><p class="muted">Every new or edited submission returns to Pending review.</p></div><button class="btn primary" data-go="add">➕ Add Product</button></div><div id="myProducts" class="grid"></div></section><section id="add" class="panel card"><h2 id="formTitle">➕ Add Product</h2><form id="productForm"><div class="formgrid"><label>Name *<input class="input" id="pname" required maxlength="160"></label><label>Category<select id="category"></select></label><label>Price PKR<input class="input" id="price" type="number" min="0"></label><label>Discount Price<input class="input" id="discount" type="number" min="0"></label><label>Visit URL<input class="input" id="visit" type="url"></label><label>Buy URL<input class="input" id="buy" type="url"></label><label>Download URL<input class="input" id="download" type="url"></label><label>Tags<input class="input" id="tags" placeholder="ai, design"></label><label class="full">Short Description<textarea id="short"></textarea></label><label class="full">Full Description<textarea id="full"></textarea></label><label>Main Image<input class="input" id="mainImage" type="file" accept="image/*"></label><label>Logo<input class="input" id="logoImage" type="file" accept="image/*"></label><label class="full">Screenshots<input class="input" id="screenshots" type="file" accept="image/*" multiple></label><label>SEO Title<input class="input" id="seoTitle"></label><label>SEO Description<input class="input" id="seoDescription"></label><label class="full">SEO Keywords<input class="input" id="seoKeywords"></label></div><div class="actions" style="margin-top:16px"><button class="btn primary">Save as Pending</button><button type="button" class="btn ghost" id="clear">Clear</button></div><p id="productMsg" class="notice hidden"></p></form></section><section id="messages" class="panel card"><h2>Messages</h2><form id="messageForm"><label>Subject<input class="input" id="subject" required maxlength="160"></label><br><label>Message<textarea id="messageBody" required maxlength="5000"></textarea></label><br><button class="btn primary">Send to Admin</button></form><div id="messagesList"></div></section></div></main><script type="module">
import{requireUser,supabase,signOut,esc}from"./supabase-client.js";import{uploadMedia}from"./supabase-media.js";let user,editId=null,products=[],cats=[];const $=id=>document.getElementById(id);const tabs=()=>document.querySelectorAll(".panel");function tab(id){tabs().forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===id))}document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>tab(x.dataset.tab));document.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>tab(x.dataset.go));$("logout").onclick=signOut;
async function loadCats(){const{data,error}=await supabase.from("categories").select("*").order("name");if(error)throw error;cats=data||[];$("category").innerHTML=cats.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join("")}
function status(s){return '<span class="status '+esc(s)+'">'+esc(s.toUpperCase())+'</span>'}
async function loadProducts(){const{data,error}=await supabase.from("products").select("*").eq("owner_id",user.id).order("created_at",{ascending:false});if(error)throw error;products=data||[];$("count").textContent=products.length;$("pending").textContent=products.filter(x=>x.status==="pending").length;$("approved").textContent=products.filter(x=>x.status==="approved").length;$("myProducts").innerHTML=products.length?products.map(p=>'<article class="card product-card">'+(p.main_image_url?'<img class="preview" src="'+esc(p.main_image_url)+'" alt="'+esc(p.name)+'">':"")+'<h3>'+esc(p.name)+'</h3>'+status(p.status)+'<p class="muted">'+esc(p.short_description||"")+'</p><div class="actions"><button class="btn ghost" data-edit="'+p.id+'">Edit</button><button class="btn danger" data-delete="'+p.id+'">Delete</button></div></article>').join(""):'<div class="empty">No submissions yet.</div>';document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editProduct(products.find(p=>p.id===b.dataset.edit)));document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this submission?")){const{error}=await supabase.from("products").delete().eq("id",b.dataset.delete);if(error)alert(error.message);else loadProducts()}})}
async function editProduct(p){editId=p.id;$("formTitle").textContent="✏️ Edit Product";$("pname").value=p.name||"";$("category").value=p.category_id||"";$("price").value=p.price_pkr||0;$("discount").value=p.discount_price_pkr||"";$("visit").value=p.visit_url||"";$("buy").value=p.buy_url||"";$("download").value=p.download_url||"";$("tags").value=(p.tags||[]).join(", ");$("short").value=p.short_description||"";$("full").value=p.full_description||"";$("seoTitle").value=p.seo_title||"";$("seoDescription").value=p.seo_description||"";$("seoKeywords").value=p.seo_keywords||"";tab("add")}
function clear(){editId=null;$("productForm").reset();$("formTitle").textContent="➕ Add Product"}
$("clear").onclick=clear;
$("productForm").onsubmit=async e=>{e.preventDefault();const cat=cats.find(c=>c.id===$("category").value);let main="",logo="";try{if($("mainImage").files[0])main=(await uploadMedia($("mainImage").files[0],"products")).url;if($("logoImage").files[0])logo=(await uploadMedia($("logoImage").files[0],"logos")).url;const row={name:$("pname").value.trim(),category_id:cat?.id||null,category_name:cat?.name||"Digital Products",price_pkr:Number($("price").value||0),discount_price_pkr:$("discount").value?Number($("discount").value):null,main_image_url:main||null,logo_url:logo||null,visit_url:$("visit").value.trim(),buy_url:$("buy").value.trim(),download_url:$("download").value.trim(),tags:$("tags").value.split(",").map(x=>x.trim()).filter(Boolean),short_description:$("short").value.trim(),full_description:$("full").value.trim(),seo_title:$("seoTitle").value.trim(),seo_description:$("seoDescription").value.trim(),seo_keywords:$("seoKeywords").value.trim(),status:"pending",published:false,featured:false,owner_id:user.id};let productId=editId;if(editId){delete row.owner_id;const{error}=await supabase.from("products").update(row).eq("id",editId);if(error)throw error}else{const{data,error}=await supabase.from("products").insert(row).select("id").single();if(error)throw error;productId=data.id}const files=[...$("screenshots").files];if(files.length){let order=0;for(const f of files){const up=await uploadMedia(f,"screenshots");const{error}=await supabase.from("product_images").insert({product_id:productId,storage_path:up.path,public_url:up.url,alt_text:$("pname").value.trim()+" screenshot",sort_order:order++});if(error)throw error}}$("productMsg").textContent="Saved. Your submission is Pending admin review.";$("productMsg").classList.remove("hidden");clear();await loadProducts();tab("products")}catch(err){$("productMsg").textContent=err.message;$("productMsg").classList.remove("hidden")}};
$("saveProfile").onclick=async()=>{const{error}=await supabase.from("profiles").update({full_name:$("name").value.trim(),avatar_url:$("avatar").value.trim()}).eq("id",user.id);$("profileMsg").textContent=error?error.message:"Profile saved.";$("profileMsg").classList.remove("hidden")};
$("messageForm").onsubmit=async e=>{e.preventDefault();const{data,error}=await supabase.from("messages").insert({user_id:user.id,subject:$("subject").value.trim()}).select("id").single();if(error)return alert(error.message);const r=await supabase.from("message_initial").insert({message_id:data.id,sender_id:user.id,body:$("messageBody").value.trim()});if(r.error)alert(r.error.message);$("messageForm").reset();loadMessages()};
async function loadMessages(){const{data:ms,error}=await supabase.from("messages").select("*").eq("user_id",user.id).order("created_at",{ascending:false});if(error)return;let html="";for(const m of ms||[]){const{data:init}=await supabase.from("message_initial").select("*").eq("message_id",m.id).order("created_at");const{data:rep}=await supabase.from("message_replies").select("*").eq("message_id",m.id).order("created_at");html+='<div class="card"><h3>'+esc(m.subject)+'</h3>'+(init||[]).map(x=>'<p class="muted"><b>You:</b> '+esc(x.body)+'</p>').join("")+(rep||[]).map(x=>'<div class="notice"><b>Admin:</b> '+esc(x.body)+'</div>').join("")+'</div>'}$("messagesList").innerHTML=html||'<div class="empty">No messages.</div>';$("unread").textContent=(await supabase.from("message_replies").select("id",{count:"exact",head:true}).eq("read_at",null)).count||0}
try{const u=await requireUser();user=u;const profile=await supabase.from("profiles").select("*").eq("id",user.id).single();if(profile.error)throw profile.error;$("name").value=profile.data?.full_name||user.user_metadata?.full_name||user.user_metadata?.name||"";$("email").value=user.email||"";$("avatar").value=profile.data?.avatar_url||user.user_metadata?.avatar_url||"";$("hello").textContent="Welcome, "+($("name").value||user.email);await loadCats();await loadProducts();await loadMessages();$("loading").classList.add("hidden");$("app").classList.remove("hidden")}catch(err){$("loading").innerHTML="<b>Dashboard could not load.</b><p style=\"margin-top:10px\">"+esc(err?.message||"Unknown error")+"</p><a class=\"btn primary\" href=\"login.html\">Back to Login</a>";console.error(err)}
</script></body></html>
