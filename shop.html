<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop — Waris Ali Digital Hub</title><link rel="stylesheet" href="portal.css"><script src="supabase-runtime.js"></script></head><body><main class="wrap"><div class="top"><a class="brand" href="index.html"><span class="logo">WA</span>Waris Ali Digital Hub</a><div class="actions"><a class="btn ghost" href="dashboard.html">Dashboard</a><a class="btn ghost" href="checkout.html">Cart</a></div></div><section class="hero"><span class="pill">MARKETPLACE</span><h1>Digital Products</h1><p class="muted">Approved products and resources from the marketplace.</p><input class="input search" id="search" placeholder="Search products"></section><section id="list" class="grid"></section></main><script type="module">import{supabase,esc}from"./supabase-client.js";let items=[];function render(){const q=search.value.toLowerCase();const a=items.filter(p=>(p.name+" "+(p.short_description||"")+" "+(p.tags||[]).join(" ")).toLowerCase().includes(q));list.innerHTML=a.length?a.map(p=>'<article class="card product-card"><img class="preview" src="'+esc(p.main_image_url||"assets/tool-placeholder.svg")+'" alt="'+esc(p.name)+'"><h3>'+esc(p.name)+'</h3><span class="pill">'+esc(p.category_name||"Product")+'</span><p class="muted">'+esc(p.short_description||"")+'</p><p><b>Rs '+Number(p.discount_price_pkr||p.price_pkr||0).toLocaleString()+'</b></p><div class="actions"><a class="btn primary" href="product.html?id='+p.id+'">View Details</a><button class="btn ghost" data-cart="'+p.id+'">Add to Cart</button></div></article>').join(""):'<div class="empty">No products published yet.</div>';document.querySelectorAll("[data-cart]").forEach(b=>b.onclick=()=>{const p=items.find(x=>x.id===b.dataset.cart);const cart=JSON.parse(localStorage.getItem("wd_cart")||"[]");cart.push({id:p.id,name:p.name,price:Number(p.discount_price_pkr||p.price_pkr||0),qty:1});localStorage.setItem("wd_cart",JSON.stringify(cart));alert("Added to cart.")})}search.oninput=render;const{data,error}=await supabase.from("products").select("*").eq("status","approved").eq("published",true).order("featured",{ascending:false});if(error)list.innerHTML='<div class="empty">'+esc(error.message)+'</div>';else{items=data||[];render()}</script></body></html>
