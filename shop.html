<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop — Waris Digital Hub</title><meta name="description" content="Digital products, apps, games, services and offers from Waris Digital Hub."><style>*{box-sizing:border-box}body{margin:0;background:#050816;color:#edf2ff;font-family:Inter,system-ui,Arial}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 600px at 5% 0%,rgba(59,130,246,.2),transparent 60%),radial-gradient(850px 600px at 95% 0%,rgba(139,92,246,.18),transparent 60%),linear-gradient(#050816,#080b18)}.wrap{max-width:1120px;margin:auto;padding:20px}.nav{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:#080c1ccc;border:1px solid #ffffff18;border-radius:18px;backdrop-filter:blur(15px)}a{color:#dbeafe;text-decoration:none}.brand{font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:25px}.card{padding:20px;border-radius:22px;background:#ffffff08;border:1px solid #ffffff12}.muted{color:#a8b4ca}.btn{display:inline-block;padding:10px 15px;border-radius:11px;border:0;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}.ghost{background:#ffffff08;color:#dbeafe;border:1px solid #ffffff18}.img{height:170px;border-radius:15px;background:linear-gradient(135deg,#172554,#4c1d95);display:grid;place-items:center;font-size:38px;font-weight:900;margin-bottom:15px;overflow:hidden}.img img{width:100%;height:100%;object-fit:cover}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><nav class="nav"><a class="brand" href="index.html">WD · Waris Digital Hub</a><div><a href="index.html#tools">Tools</a> · <a href="guides.html">Guides</a> · <a href="checkout.html">Cart (<span id="count">0</span>)</a></div></nav><h1>Shop</h1><p class="muted">Published products, digital resources, apps, games and services. Only products actually published in the database are shown.</p><main class="grid" id="list"><div class="card">Loading…</div></main></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getFirestore,collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";import{firebaseConfig}from"./firebase-config.js";
const db=getFirestore(initializeApp(firebaseConfig)),box=document.getElementById("list"),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));let cart=JSON.parse(localStorage.getItem("wd_cart")||"[]");
function update(){document.getElementById("count").textContent=cart.reduce((n,x)=>n+Number(x.qty||1),0);localStorage.setItem("wd_cart",JSON.stringify(cart))}
function add(p){const x=cart.find(x=>x.id===p.id);if(x)x.qty=(x.qty||1)+1;else cart.push({...p,qty:1});update();alert("Added to cart.")}
async function load(){const s=await getDocs(query(collection(db,"products"),where("status","==","approved"),where("published","==",true)));const a=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.published!==false);box.innerHTML=a.length?a.map(p=>'<article class="card"><div class="img">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':esc((p.name||"WD").slice(0,2).toUpperCase()))+'</div><h2>'+esc(p.name)+'</h2><p class="muted">'+esc(p.desc||"")+'</p><p><b>Rs '+Number(p.sale||p.price||0).toLocaleString()+'</b></p><a class="btn primary" href="product.html?id='+esc(p.id)+'">View Details</a> <button class="btn primary" data-id="'+esc(p.id)+'">Add to Cart</button> '+(p.url?'<a class="btn ghost" href="'+esc(p.url)+'" target="_blank" rel="noopener">Visit</a>':"")+'</article>').join(""):'<div class="card"><h2>No published products yet</h2><p class="muted">Products added through the Products Manager will appear here after they are published.</p></div>';box.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{const p=a.find(x=>x.id===b.dataset.id);add({id:p.id,name:p.name,price:Number(p.sale||p.price||0),image:p.image||"",cat:p.cat||"Product"})})}
update();load().catch(e=>box.innerHTML='<div class="card"><h2>Shop temporarily unavailable</h2><p class="muted">Please try again later.</p></div>');
</script></body></html>
