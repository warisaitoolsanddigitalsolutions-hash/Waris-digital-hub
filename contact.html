<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — Waris Digital Hub</title><meta name="description" content="Contact Waris Digital Hub for questions, order support, product questions, partnerships and corrections."><link rel="canonical" href="https://httpswarisalidigitalhub.com/contact.html"><style>*{box-sizing:border-box}body{margin:0;background:#050816;color:#edf2ff;font-family:Inter,system-ui,Arial;line-height:1.7}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 600px at 5% 0%,rgba(59,130,246,.2),transparent 60%),radial-gradient(850px 600px at 95% 0%,rgba(139,92,246,.18),transparent 60%),linear-gradient(#050816,#080b18)}.wrap{max-width:850px;margin:auto;padding:20px}.nav{display:flex;justify-content:space-between;padding:13px 16px;border-radius:18px;background:rgba(8,12,28,.75);border:1px solid rgba(255,255,255,.1)}a{color:#bfdbfe;text-decoration:none}.card{margin-top:24px;padding:28px;border-radius:24px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;color:#b8c4da;font-size:13px}input,select,textarea{width:100%;margin-top:6px;padding:12px;border-radius:11px;border:1px solid #293552;background:#0b1120;color:#fff}textarea{min-height:150px}.btn{border:0;padding:12px 17px;border-radius:11px;color:#fff;font-weight:800;background:linear-gradient(135deg,#3b82f6,#8b5cf6);cursor:pointer}.notice{padding:13px;border-radius:12px;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.12);color:#b8f4ff;margin-top:18px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><nav class="nav"><a href="index.html"><b>WD</b> · Waris Digital Hub</a><a href="index.html#tools">Tools</a></nav><main class="card"><h1>Get in Touch</h1><p>Questions, order support, product questions, partnerships or corrections.</p><form id="contactForm"><div class="grid"><label>Name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Topic<select id="topic"><option>General question</option><option>Order support</option><option>Product question</option><option>Partnership</option><option>Correction / feedback</option></select></label><label>Product / Order<input id="order" placeholder="Optional"></label></div><label style="margin-top:14px">Message<textarea id="message" required></textarea></label><br><button class="btn">Send Message</button></form><div class="notice">Email: <a href="mailto:Warisalidigitalsolutions@gmail.com">Warisalidigitalsolutions@gmail.com</a><br>Never send passwords, OTP codes, payment card details or private login credentials.</div></main></div><script>document.getElementById("contactForm").onsubmit=e=>{e.preventDefault();const s=encodeURIComponent("Waris Digital Hub — "+document.getElementById("topic").value);const b=encodeURIComponent("Name: "+document.getElementById("name").value+"\nEmail: "+document.getElementById("email").value+"\nProduct/Order: "+document.getElementById("order").value+"\n\n"+document.getElementById("message").value);location.href="mailto:Warisalidigitalsolutions@gmail.com?subject="+s+"&body="+b}</script></body></html>
