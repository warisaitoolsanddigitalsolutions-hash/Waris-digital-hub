<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up — Waris Ali Digital Hub</title><link rel="stylesheet" href="portal.css"></head><body><main class="wrap"><div class="top"><a class="brand" href="index.html"><span class="logo">WA</span>Waris Ali Digital Hub</a><a class="btn ghost" href="login.html">Login</a></div><section class="hero"><div class="card" style="max-width:560px;margin:30px auto"><h1>Create your account</h1><p class="muted">Join the marketplace and submit products for admin review.</p><form id="form"><div class="formgrid"><label>Full name<input class="input" id="name" required maxlength="80"></label><label>Email<input class="input" id="email" type="email" required autocomplete="email"></label><label>Password<input class="input" id="password" type="password" required minlength="6" autocomplete="new-password"></label><label>Confirm password<input class="input" id="confirm" type="password" required minlength="6"></label></div><br><button class="btn primary" style="width:100%">Sign Up</button></form><button id="google" class="btn ghost" style="width:100%;margin-top:10px">Sign up with Google</button><p id="msg" class="notice hidden"></p></div></section></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getAuth,setPersistence,browserLocalPersistence,createUserWithEmailAndPassword,updateProfile,GoogleAuthProvider,signInWithRedirect,getRedirectResult}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";import{getFirestore,doc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";import{firebaseConfig}from"./firebase-config.js";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),msg=document.getElementById("msg");await setPersistence(auth,browserLocalPersistence);function show(x){msg.textContent=x;msg.classList.remove("hidden")}document.getElementById("form").onsubmit=async e=>{e.preventDefault();if(password.value!==confirm.value)return show("Passwords do not match.");try{const c=await createUserWithEmailAndPassword(auth,email.value.trim(),password.value);await updateProfile(c.user,{displayName:name.value.trim()});await setDoc(doc(db,"users",c.user.uid),{uid:c.user.uid,name:name.value.trim(),email:c.user.email,photoURL:c.user.photoURL||"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});location.href="dashboard.html"}catch(e){show(e.message)}};document.getElementById("google").onclick=async()=>{try{await signInWithRedirect(auth,new GoogleAuthProvider())}catch(e){show(e.message)}};getRedirectResult(auth).then(async r=>{if(r?.user){await setDoc(doc(db,"users",r.user.uid),{uid:r.user.uid,name:r.user.displayName||"",email:r.user.email||"",photoURL:r.user.photoURL||"",updatedAt:serverTimestamp()},{merge:true});location.href="dashboard.html"}}).catch(e=>show(e.message));</script></body></html>
