<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Category — Waris Ali Digital Hub</title><link rel="stylesheet" href="portal.css"><script src="supabase-runtime.js"></script></head><body><main class="wrap"><div class="top"><a class="brand" href="index.html"><span class="logo">WA</span>Waris Ali Digital Hub</a><a class="btn ghost" href="login.html">Login</a></div><section class="hero"><span class="pill">CATEGORY</span><h1 id="title">Browse</h1><input class="input search" id="search" placeholder="Search this category"></section><section id="list" class="grid"></section></main><script type="module">import{supabase,esc}from"./supabase-client.js";const cat=new URLSearchParams(location.search).get("cat")||"AI Tools";title.textContent=cat;let items=[];function render(){const q=search.value.toLowerCase();const a=items.filter(p=>(p.name+" "+(p.short_description||"")+" "+(p.tags||[]).join(" ")).toLowerCase().includes(q));list.innerHTML=a.length?a.map(p=>'<article class="card product-card"><img class="preview" src="'+esc(p.main_image_url||"assets/tool-placeholder.svg")+'" alt="'+esc(p.name)+'"><h3>'+esc(p.name)+'</h3><span class="pill">'+esc(p.category_name||cat)+'</span><p class="muted">'+esc(p.short_description||"")+'</p><div class="actions"><a class="btn primary" href="product.html?id='+encodeURIComponent(p.id)+'">View Details</a>'+(p.visit_url?'<a class="btn ghost" target="_blank" href="'+esc(p.visit_url)+'">Visit</a>':"")+'</div></article>').join(""):'<div class="empty">No published listings found.</div>'}search.oninput=render;const{data,error}=await supabase.from("products").select("*").eq("category_name",cat).eq("status","approved").eq("published",true).order("featured",{ascending:false});items=data||[];if(error)list.innerHTML='<div class="empty">'+esc(error.message)+'</div>';else render();</script></body></html>
