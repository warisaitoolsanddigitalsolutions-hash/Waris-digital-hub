<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Category — Waris Ali Digital Hub</title><link rel="stylesheet" href="portal.css"></head><body><main class="wrap"><div class="top"><a class="brand" href="index.html"><span class="logo">WA</span>Waris Ali Digital Hub</a><nav class="nav"><a href="index.html">Home</a><a href="category.html?cat=AI%20Tools">AI Tools</a><a href="category.html?cat=Apps">Apps</a><a href="category.html?cat=Websites">Websites</a><a href="category.html?cat=Games">Games</a><a href="category.html?cat=Digital%20Products">Digital Products</a><a href="category.html?cat=Services">Services</a><a href="login.html">Login</a></nav></div><section class="hero"><div class="eyebrow" id="eyebrow">CATEGORY</div><h1 id="title">Browse</h1><p>Approved and published listings from Waris Ali Digital Hub.</p><input class="input search" id="search" placeholder="Search this category..."></section><section id="list" class="grid"><div class="empty">Loading…</div></section></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getFirestore,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";import{firebaseConfig}from"./firebase-config.js";const app=initializeApp(firebaseConfig),db=getFirestore(app),cat=new URLSearchParams(location.search).get("cat")||"AI Tools",list=document.getElementById("list"),search=document.getElementById("search");document.getElementById("title").textContent=cat;document.getElementById("eyebrow").textContent=cat.toUpperCase();const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));let items=[];function render(){const q=search.value.toLowerCase();const a=items.filter(p=>(p.name+" "+(p.short||p.desc||"")+" "+(p.tags||[]).join(" ")).toLowerCase().includes(q));list.innerHTML=a.length?a.map(p=>'<article class="card product-card">'+(p.image?'<img class="preview" src="'+esc(p.image)+'" alt="">':"")+'<h3>'+esc(p.name)+'</h3><span class="pill">'+esc(p.cat)+'</span><p class="muted">'+esc(p.short||p.desc||"")+'</p><div class="actions"><a class="btn primary" target="_blank" href="'+esc(p.url||"#")+'">Visit</a>'+(p.buy?'<a class="btn ghost" target="_blank" href="'+esc(p.buy)+'">Buy</a>':p.download?'<a class="btn ghost" target="_blank" href="'+esc(p.download)+'">Download</a>':"")+'</div></article>').join(""):'<div class="empty">No published listings found.</div>'}search.oninput=render;getDocs(query(collection(db,"products"),where("cat","==",cat),where("status","==","approved"),where("published","==",true))).then(s=>{items=s.docs.map(d=>d.data());render()}).catch(e=>{list.innerHTML='<div class="empty">'+esc(e.message)+'</div>'});</script></body></html>
