<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Waris Digital Hub</title><meta name="description" content="Secure order request checkout for Waris Digital Hub."><style>*{box-sizing:border-box}body{margin:0;background:#050816;color:#edf2ff;font-family:Inter,system-ui,Arial;line-height:1.7}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 600px at 5% 0%,rgba(59,130,246,.2),transparent 60%),radial-gradient(850px 600px at 95% 0%,rgba(139,92,246,.18),transparent 60%),linear-gradient(#050816,#080b18)}.wrap{max-width:900px;margin:auto;padding:20px}.nav{display:flex;justify-content:space-between;padding:13px 16px;border-radius:18px;background:#080c1ccc;border:1px solid #ffffff18}.card{margin-top:20px;padding:25px;border-radius:22px;background:#ffffff08;border:1px solid #ffffff12}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;color:#b8c4da;font-size:13px}input,textarea{width:100%;margin-top:5px;padding:12px;border-radius:11px;border:1px solid #293552;background:#0b1120;color:#fff}textarea{min-height:100px}.btn{padding:11px 16px;border:0;border-radius:11px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}.muted{color:#a8b4ca}.notice{padding:13px;border-radius:13px;background:#22d3ee0d;border:1px solid #22d3ee22;color:#b8f4ff}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><nav class="nav"><a href="index.html"><b>WD</b> · Waris Digital Hub</a><a href="shop.html">Shop</a></nav><main class="card"><h1>Checkout</h1><div id="items"></div><div class="notice">No card numbers or passwords are collected here. Payment is not claimed as processed unless a real payment provider is configured.</div><form id="form" class="card"><div class="grid"><label>Name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Phone<input id="phone"></label><label>City / delivery note<input id="address"></label></div><br><button class="btn primary">Place Order Request</button></form></main></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getFirestore,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";import{firebaseConfig}from"./firebase-config.js";
const db=getFirestore(initializeApp(firebaseConfig)),cart=JSON.parse(localStorage.getItem("wd_cart")||"[]"),items=document.getElementById("items");const total=cart.reduce((n,x)=>n+Number(x.price||0)*Number(x.qty||1),0);items.innerHTML=cart.length?cart.map(x=>'<p>'+String(x.name).replace(/[&<>]/g,"")+' × '+Number(x.qty||1)+' — Rs '+(Number(x.price||0)*Number(x.qty||1)).toLocaleString()+'</p>').join("")+'<h2>Total: Rs '+total.toLocaleString()+'</h2>':'<p class="muted">Your cart is empty. <a href="shop.html">Go to Shop</a></p>';
document.getElementById("form").onsubmit=async e=>{e.preventDefault();if(!cart.length)return alert("Cart is empty.");const order={customer:{name:document.getElementById("name").value.trim(),email:document.getElementById("email").value.trim(),phone:document.getElementById("phone").value.trim(),address:document.getElementById("address").value.trim()},items:cart.map(x=>({id:x.id,name:x.name,price:x.price,qty:x.qty})),amount:total,status:"pending",paymentStatus:"not_configured",createdAt:serverTimestamp()};try{const ref=await addDoc(collection(db,"orders"),order);localStorage.removeItem("wd_cart");location.href="order-confirmation.html?id="+encodeURIComponent(ref.id)}catch(err){alert("Order could not be saved yet. The orders collection needs its Firebase security rule enabled.")}};
</script></body></html>
