<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Waris Ali Digital Hub</title><link rel="stylesheet" href="portal.css"></head><body><main class="wrap"><div class="top"><a class="brand" href="index.html"><span class="logo">WA</span>Waris Ali Digital Hub</a><a class="btn ghost" href="shop.html">Shop</a></div><section class="hero"><h1>Checkout</h1><p class="muted">Orders are recorded persistently. Payment gateway integration is modular and not falsely marked as paid.</p></section><div class="card"><div id="items"></div><form id="form"><div class="formgrid"><label>Name<input class="input" id="name" required></label><label>Email<input class="input" id="email" type="email" required></label><label>Phone<input class="input" id="phone"></label></div><br><button class="btn primary">Place Order</button></form><p id="msg" class="notice hidden"></p></div></main><script type="module">import{requireUser,supabase,esc}from"./supabase-client.js";const user=await requireUser(),cart=JSON.parse(localStorage.getItem("wd_cart")||"[]"),items=document.getElementById("items"),total=cart.reduce((n,x)=>n+Number(x.price||0)*Number(x.qty||1),0);items.innerHTML=cart.length?cart.map(x=>'<p>'+esc(x.name)+' × '+x.qty+' — Rs '+(Number(x.price)*x.qty).toLocaleString()+'</p>').join("")+'<h2>Total: Rs '+total.toLocaleString()+'</h2>':'<p class="muted">Cart is empty.</p>';document.getElementById("form").onsubmit=async e=>{e.preventDefault();if(!cart.length)return;const{data,error}=await supabase.from("orders").insert({user_id:user.id,customer_name:name.value.trim(),customer_email:email.value.trim(),customer_phone:phone.value.trim(),items:cart,amount_pkr:total,status:"pending",payment_status:"not_configured"}).select("id").single();if(error){msg.textContent=error.message;msg.classList.remove("hidden");return}localStorage.removeItem("wd_cart");location.href="order-confirmation.html?id="+data.id}</script></body></html>
