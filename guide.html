const guides=[
["ChatGPT Beginner Guide","AI Basics","Start with a clear task and give enough context for the answer you need.","Write a short prompt that names the task, audience, constraints and desired format. Ask follow-up questions when the first result is incomplete. For important facts, verify them with reliable sources instead of assuming an AI answer is correct.","Use AI as an assistant, not as the sole source for high-stakes decisions."],
["DeepSeek Beginner Guide","AI Basics","A practical starting point for using an AI assistant responsibly.","Begin with ordinary low-risk tasks such as brainstorming, explanations or coding help. Review outputs, especially factual claims and generated code, before relying on them.","Check the current service availability, terms and privacy information on the official provider site."],
["AI Research Sources Guide","Research","Build a research workflow that keeps primary evidence visible.","Start with official documentation, government sources, academic papers or direct company statements where appropriate. Use search and AI tools to discover sources, then open the original source and check its date and context.","Do not treat a generated citation as proof until you open and verify the source."],
["Free vs Paid AI Tools Guide","Buying Advice","Compare what you actually need instead of buying because of a feature list.","Check usage limits, model access, file limits, speed, collaboration, export options, privacy terms and cancellation conditions. Test the free tier when available.","Pricing and availability can change; verify current details before paying."],
["Digital Safety Guide","Safety","Protect accounts and personal information while using online services.","Use unique passwords and multi-factor authentication. Update your phone and apps, check the domain before signing in, and be cautious with unexpected links or files.","Never send passwords, OTPs, recovery codes, card PINs or private credentials to another person."],
["Grammarly Beginner Guide","Writing","Use writing assistance as an editing layer, not an automatic replacement for your voice.","Draft your message first, then review suggestions for grammar, clarity and tone. Keep changes that improve meaning and reject changes that alter what you intended to say.","Review text before sending, especially names, numbers and sensitive information."],
["Notion Content Calendar Guide","Productivity","Turn a simple database into a practical content calendar.","Create fields for title, publish date, platform, format, status and notes. Add calendar and board views so you can see upcoming work and what is already published.","Keep the system small enough that maintaining it does not become the work."],
["Website Tool Selection Guide","Websites","Choose a web service from your real requirements.","List the task, integrations, account needs, reliability, privacy expectations, pricing and export options. Compare a small number of suitable services rather than every option online.","Read current provider documentation and terms before entering sensitive information."],
["Figma Beginner Guide","Design","Learn the core concepts before building complex designs.","Start with frames and layers, then practice auto layout and components. Build a small screen and prototype one user flow before learning advanced features.","Keep components consistent and name important layers clearly."],
["GitHub Beginner Guide","Developer","Understand repositories, commits, branches and collaboration.","A repository stores project files and history. Commits record changes; branches isolate work; pull requests help review changes before merging.","Never commit passwords, API keys, private keys or other secrets."],
["TikTok + AI Tools Guide","Content","Use AI to support content creation while keeping your own judgment.","AI can help brainstorm hooks, outline scripts, generate variations and organize ideas. Review every claim and adapt the final content to your audience and platform rules.","Avoid fake engagement, misleading claims and copied copyrighted material."],
["AI Tools for Students","Education","Use AI for learning rather than bypassing learning.","Ask for explanations, examples, practice questions, study plans and feedback. Try the problem yourself first when the goal is to learn a skill.","Follow your school or teacher's rules for AI use."],
["AI Tools for Content Creators","Content","Combine research, writing, design and editing tools into a repeatable workflow.","Use one tool for ideation, another for research or drafting when useful, then edit and fact-check the final content yourself. Keep source notes for claims you publish.","Do not copy protected material simply because an AI tool can reproduce a similar style or text."],
["Choosing the Right Digital Tool","Buying Advice","A good tool is one that fits the task and constraints.","Compare the actual workflow, features, limitations, privacy, support, compatibility and total cost. A familiar tool that solves the task may be better than a feature-heavy alternative.","Reassess tools periodically as needs and pricing change."],
["Online Privacy and Account Safety","Safety","Reduce unnecessary exposure of personal information.","Review app permissions, use multi-factor authentication, sign out of shared devices and avoid uploading sensitive documents unless necessary and understood.","Confirm the site address before entering credentials."],
["How to Compare Free and Paid Tools","Buying Advice","Use a simple comparison checklist before upgrading.","Record the free plan's limits and the paid plan's features that matter to you. Estimate actual monthly usage and check cancellation terms.","Do not assume a paid plan is automatically better for your workflow."],
