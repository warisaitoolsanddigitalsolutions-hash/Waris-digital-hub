<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Waris Ali Digital Hub</title><link rel="stylesheet" href="portal.css"><style>.gallery{display:grid;grid-template-columns:1fr 110px;gap:12px}.main-shot{width:100%;height:560px;object-fit:cover;background:#050914;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.28)}.thumbs{display:flex;flex-direction:column;gap:8px;overflow:auto}.thumbs img{width:100%;height:80px;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid transparent}.thumbs img.active{border-color:#8b5cf6}@media(max-width:700px){.gallery{grid-template-columns:1fr}.thumbs{flex-direction:row}.thumbs img{width:90px;flex:none}}</style><script src="supabase-runtime.js"></script></head><body><main class="wrap"><div class="top"><a class="brand" href="index.html"><span class="logo">WA</span>Waris Ali Digital Hub</a><a class="btn ghost" href="shop.html">Shop</a></div><div id="box" class="card">Loading…</div></main><script type="module">import{supabase,esc}from"./supabase-client.js";const id=new URLSearchParams(location.search).get("id"),box=document.getElementById("box");if(!id){box.innerHTML="<div class='empty'>Product not found.</div>"}else{const{data:p,error}=await supabase.from("products").select("*,product_images(*)").eq("id",id).single();if(error||!p||p.status!=="approved"||!p.published){box.innerHTML="<div class='empty'>This listing is not currently published.</div>"}else{const imgs=(p.product_images||[]).sort((a,b)=>a.sort_order-b.sort_order);const all=[p.main_image_url,p.logo_url,...imgs.map(x=>x.public_url)].filter(Boolean);document.title=(p.seo_title||p.name)+" — Waris Ali Digital Hub";box.innerHTML='<div class="gallery"><div><img id="main" class="main-shot" src="'+esc(all[0]||"assets/tool-placeholder.svg")+'" alt="'+esc(p.name)+'"><div style="margin-top:18px"><span class="pill">'+esc(p.category_name||"Product")+'</span><h1>'+esc(p.name)+'</h1><p class="muted">'+esc(p.short_description||"")+'</p><p><b>Rs '+Number(p.discount_price_pkr||p.price_pkr||0).toLocaleString()+'</b></p><div class="actions">'+(p.visit_url?'<a class="btn primary" target="_blank" rel="noopener" href="'+esc(p.visit_url)+'">Visit / Open</a>':"")+(p.buy_url?'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(p.buy_url)+'">Buy</a>':"")+(p.download_url?'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(p.download_url)+'">Download</a>':"")+'</div></div></div><div class="thumbs">'+all.map((x,i)=>'<img class="'+(i===0?"active":"")+'" data-src="'+esc(x)+'" src="'+esc(x)+'" alt="'+esc(p.name)+' screenshot '+(i+1)+'">').join("")+'</div></div><div class="card"><h2>About</h2><p class="muted">'+esc(p.full_description||"")+'</p></div>';document.querySelectorAll(".thumbs img").forEach(t=>t.onclick=()=>{document.getElementById("main").src=t.dataset.src;document.querySelectorAll(".thumbs img").forEach(x=>x.classList.remove("active"));t.classList.add("active")});}}}</script></body></html>
