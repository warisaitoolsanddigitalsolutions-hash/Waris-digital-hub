<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Waris Ali Digital Hub</title><link rel="stylesheet" href="portal.css"></head><body><main class="wrap"><div class="top"><a class="brand" href="index.html"><span class="logo">WA</span>Waris Ali Digital Hub</a><div class="actions"><a class="btn ghost" href="shop.html">Shop</a><a class="btn ghost" href="login.html">Login</a></div></div><section id="box" class="hero"><div class="empty">Loading product…</div></section></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";import{firebaseConfig}from"./firebase-config.js";const db=getFirestore(initializeApp(firebaseConfig)),id=new URLSearchParams(location.search).get("id"),box=document.getElementById("box"),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));if(!id){box.innerHTML='<div class="card">Product not found.</div>'}else{getDoc(doc(db,"products",id)).then(s=>{if(!s.exists()||s.data().status!=="approved"||s.data().published!==true){box.innerHTML='<div class="card"><h1>Product unavailable</h1><p class="muted">This listing is not currently published.</p></div>';return}const p=s.data();document.title=(p.seoTitle||p.name)+" — Waris Ali Digital Hub";box.innerHTML='<div class="card">'+(p.image?'<img class="preview" style="height:280px" src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':"")+'<span class="pill">'+esc(p.cat||"Product")+'</span><h1>'+esc(p.name)+'</h1><p class="muted">'+esc(p.short||"")+'</p><p><b>Rs '+Number(p.sale||p.price||0).toLocaleString()+'</b></p><div class="actions">'+(p.url?'<a class="btn primary" target="_blank" href="'+esc(p.url)+'">Visit / Open</a>':"")+(p.buy?'<a class="btn ghost" target="_blank" href="'+esc(p.buy)+'">Buy</a>':"")+(p.download?'<a class="btn ghost" target="_blank" href="'+esc(p.download)+'">Download</a>':"")+'</div><div class="card"><h2>About this product</h2><p class="muted">'+esc(p.full||p.desc||"")+'</p></div>'+(p.screenshots?.length?'<h2>Screenshots</h2><div class="grid">'+p.screenshots.map(x=>'<img class="preview" src="'+esc(x)+'" alt="">').join("")+'</div>':"")+'</div>'}).catch(e=>box.innerHTML='<div class="card"><h1>Unable to load</h1><p class="muted">'+esc(e.message)+'</p></div>')}</script></body></html>
