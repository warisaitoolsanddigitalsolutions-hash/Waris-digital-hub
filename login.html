<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Waris Ali Digital Hub</title><link rel="stylesheet" href="portal.css"></head><body><main class="wrap"><div class="top"><a class="brand" href="index.html"><span class="logo">WA</span>Waris Ali Digital Hub</a><a class="btn ghost" href="signup.html">Create account</a></div><section class="hero"><div class="card" style="max-width:520px;margin:30px auto"><h1>Welcome back</h1><p class="muted">Login to manage your profile, products and messages.</p><form id="form"><label>Email<input class="input" id="email" type="email" required autocomplete="email"></label><br><label>Password<input class="input" id="password" type="password" required autocomplete="current-password"></label><br><button class="btn primary" style="width:100%">Login</button></form><button id="google" class="btn ghost" style="width:100%;margin-top:10px">Continue with Google</button><button id="reset" class="btn" style="width:100%;margin-top:8px;color:#93c5fd">Forgot password?</button><p id="msg" class="notice hidden"></p></div></section></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getAuth,setPersistence,browserLocalPersistence,signInWithEmailAndPassword,GoogleAuthProvider,signInWithRedirect,getRedirectResult}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";import{firebaseConfig}from"./firebase-config.js";const app=initializeApp(firebaseConfig),auth=getAuth(app),msg=document.getElementById("msg");await setPersistence(auth,browserLocalPersistence);function show(x){msg.textContent=x;msg.classList.remove("hidden")}document.getElementById("form").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,email.value.trim(),password.value);location.href="dashboard.html"}catch(e){show(e.message)}};document.getElementById("google").onclick=async()=>{try{await signInWithRedirect(auth,new GoogleAuthProvider())}catch(e){show(e.message)}};document.getElementById("reset").onclick=async()=>{const{sendPasswordResetEmail}=await import("https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js");if(!email.value.trim())return show("Enter your email first.");try{await sendPasswordResetEmail(auth,email.value.trim());show("Password reset email sent.")}catch(e){show(e.message)}};getRedirectResult(auth).then(r=>{if(r?.user)location.href="dashboard.html"}).catch(e=>show(e.message));</script></body></html>
