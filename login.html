<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Waris Ali Digital Hub</title><link rel="stylesheet" href="portal.css"><script src="supabase-runtime.js"></script></head><body><main class="wrap"><div class="top"><a class="brand" href="index.html"><span class="logo">WA</span>Waris Ali Digital Hub</a><a class="btn ghost" href="index.html">Home</a></div><section class="hero"><div class="card" style="max-width:520px;margin:30px auto;text-align:center"><div class="logo" style="margin:auto">WA</div><h1>Login / Signup</h1><p class="muted">Use your Google account for a secure persistent session.</p><button id="google" class="btn primary" style="width:100%">Continue with Google</button><p id="msg" class="notice hidden"></p><p class="muted" style="font-size:12px">Your account role is enforced by the database security policies.</p></div></section></main><script type="module">import{signInWithGoogle,supabase}from"./supabase-client.js";const m=document.getElementById("msg"),b=document.getElementById("google");let busy=false;async function routeUser(user){if(!user)return;try{const{data:profile,error}=await supabase.from("profiles").select("role").eq("id",user.id).maybeSingle();if(error)throw error;location.replace(profile?.role==="admin"?"admin.html":"dashboard.html")}catch(e){m.textContent="Login succeeded, but your profile could not be loaded: "+e.message;m.classList.remove("hidden");b.disabled=false;busy=false}}b.onclick=async()=>{if(busy)return;busy=true;b.disabled=true;try{await signInWithGoogle()}catch(e){m.textContent=e.message;m.classList.remove("hidden");b.disabled=false;busy=false}};supabase.auth.onAuthStateChange((event,session)=>{if(session?.user){setTimeout(()=>routeUser(session.user),0)}else if(event==="SIGNED_OUT"){b.disabled=false;busy=false}});const p=new URLSearchParams(location.search);if(p.get("error")||p.get("error_description")){m.textContent=(p.get("error")||"OAuth error")+": "+(p.get("error_description")||"");m.classList.remove("hidden")}const{data:{session},error:sessionError}=await supabase.auth.getSession();if(sessionError){m.textContent="Session error: "+sessionError.message;m.classList.remove("hidden")}else if(session?.user){await routeUser(session.user)};</script></body></html>
